name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group tests

      - name: Run tests
        run: python -m pytest tests/

  build-and-run:
    name: Build and run Flaskr
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist
          ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create venv and install wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl

      - name: Install Flaskr (keeping Flask from the wheel)
        run: |
          VENV="$RUNNER_TEMP/venv/bin"
          BEFORE=$("$VENV/python" -c "import importlib.metadata as m; print(m.version('flask'))")
          "$VENV/pip" install --no-deps ./examples/tutorial
          AFTER=$("$VENV/python" -c "import importlib.metadata as m; print(m.version('flask'))")
          echo "Flask before: $BEFORE, after: $AFTER"
          test "$BEFORE" = "$AFTER"
          "$VENV/pip" list

      - name: Initialize Flaskr database
        run: |
          "$RUNNER_TEMP/venv/bin/flask" --app flaskr init-db

      - name: Run Flaskr on port 5000
        run: |
          nohup "$RUNNER_TEMP/venv/bin/flask" --app flaskr run --host 0.0.0.0 --port 5000 > flaskr.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "Flaskr is up on port 5000"
              exit 0
            fi
            sleep 1
          done
          echo "Flaskr failed to start"; cat flaskr.log; exit 1
