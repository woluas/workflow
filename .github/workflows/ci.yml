name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install project and test dependencies (versions from uv.lock)
        run: uv sync --python ${{ matrix.python-version }} --no-default-groups --group tests

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/

  build-and-run:
    name: Build and run Flaskr
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist
          ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create venv and install wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl

      - name: Install Flaskr (keeping Flask from the wheel)
        run: |
          VENV="$RUNNER_TEMP/venv/bin"
          BEFORE=$("$VENV/python" -c "import importlib.metadata as m; print(m.version('flask'))")
          "$VENV/pip" install --no-deps ./examples/tutorial
          AFTER=$("$VENV/python" -c "import importlib.metadata as m; print(m.version('flask'))")
          echo "Flask before: $BEFORE, after:
